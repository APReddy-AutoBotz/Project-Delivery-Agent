packages:
  - apps/*
  - packages/*
overrides:
  body-parser: 2.4.0
  brace-expansion: 5.0.11
  deepmerge-ts: 8.0.0
  effect: 3.22.2
  image-size: 2.1.0
  multer: 2.5.0
  mysql2: 3.23.1
  picomatch@4.0.7: 'npm:@ryotsu/picomatch@4.0.7-a'
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
  vite: 7.3.7
allowBuilds:
  '@prisma/engines@7.10.0': true
  '@scarf/scarf': false
  esbuild: true
  'prisma@7.10.0': true
minimumReleaseAgeExclude:
  - jose@6.2.12

autoInstallPeers: false
resolvePeersFromWorkspaceRoot: false
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
