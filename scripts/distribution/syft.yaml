check-for-app-update: false
scope: squashed
parallelism: 2
license:
  content: all
file:
  metadata:
    selection: all
    digests: [sha256]
  content:
    skip-files-above-size: 5242880
    globs:
      - '/**/LICENSE*'
      - '/**/License*'
      - '/**/license*'
      - '/**/LICENCE*'
      - '/**/licence*'
      - '/**/NOTICE*'
      - '/**/Notice*'
      - '/**/notice*'
      - '/**/COPYRIGHT*'
      - '/**/Copyright*'
      - '/**/copyright*'
      - '/usr/share/common-licenses/**'
      - '/srv/third-party-components.json'
      - '/srv/THIRD_PARTY_NOTICES.txt'
      - '/app/runtime-inventory.json'
      - '/app/node_modules/.pnpm/@tokenizer+token@0.3.0/node_modules/@tokenizer/token/README.md'
      - '/app/node_modules/.pnpm/pg-types@2.2.0/node_modules/pg-types/README.md'
      - '/app/node_modules/.pnpm/pgpass@1.0.5/node_modules/pgpass/README.md'
      - '/usr/share/caddy/modules/**'
      - '/usr/local/share/doc/node/supplements/**'
enrich: []
exclude: []
golang:
  search-local-mod-cache-licenses: false
  search-local-vendor-licenses: false
  search-remote-licenses: false
javascript:
  search-remote-licenses: false
