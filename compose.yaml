name: pdaa-foundation
services:
  database:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: pdaa
      POSTGRES_DB: pdaa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:local first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - foundation-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdaa -d pdaa"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  foundation-db:
