schema_version: '1.0'
product: Project Delivery Assurance Agent
baseline: '0.1'
requirements:
- id: FR-UPD-001
  type: functional
  title: Due update detection
  statement: The system must create an update request when a configured reporting obligation becomes due and no
    valid current update exists.
  priority: Must
  release: R1
  status: approved
  parent: PR-006
  source_doc: FRD.md
- id: FR-UPD-002
  type: functional
  title: Focused question
  statement: The request must identify the project context and the specific missing or stale information.
  priority: Must
  release: R1
  status: approved
  parent: PR-006
  source_doc: FRD.md
- id: FR-UPD-003
  type: functional
  title: Responsible recipient
  statement: The system must address the request to the configured responsible person and avoid broad unnecessary
    distribution.
  priority: Must
  release: R1
  status: approved
  parent: PR-006
  source_doc: FRD.md
- id: FR-UPD-004
  type: functional
  title: Secure update page
  statement: A recipient must be able to submit an update through a secure, time-limited or authenticated page.
  priority: Must
  release: R1
  status: approved
  parent: PR-006
  source_doc: FRD.md
- id: FR-UPD-005
  type: functional
  title: Structured quick responses
  statement: The request may provide configurable structured response choices in addition to free text.
  priority: Should
  release: R1
  status: approved
  parent: PR-006
  source_doc: FRD.md
- id: FR-UPD-006
  type: functional
  title: Free-text response
  statement: The recipient must be able to provide a natural-language update.
  priority: Must
  release: R1
  status: approved
  parent: PR-006
  source_doc: FRD.md
- id: FR-UPD-007
  type: functional
  title: Response extraction
  statement: The system may use AI to extract proposed structured facts from the response.
  priority: Must
  release: R1
  status: approved
  parent: PR-006
  source_doc: FRD.md
- id: FR-UPD-008
  type: functional
  title: Interpretation confirmation
  statement: The recipient or authorized reviewer must be able to confirm or correct the extracted interpretation.
  priority: Must
  release: R1
  status: approved
  parent: PR-009
  source_doc: FRD.md
- id: FR-UPD-009
  type: functional
  title: Ambiguity follow-up
  statement: The system must request clarification when a response cannot safely support the required fact or action.
  priority: Must
  release: R1
  status: approved
  parent: PR-006
  source_doc: FRD.md
- id: FR-UPD-010
  type: functional
  title: Stop pending reminders
  statement: A valid response must cancel or suppress pending reminders for the satisfied obligation.
  priority: Must
  release: R1
  status: approved
  parent: PR-007
  source_doc: FRD.md
- id: FR-UPD-011
  type: functional
  title: Absence and skip handling
  statement: The recipient must be able to indicate absence, delegation or an allowed skip reason.
  priority: Should
  release: R1
  status: approved
  parent: PR-007
  source_doc: FRD.md
- id: FR-UPD-012
  type: functional
  title: Time-zone awareness
  statement: Requests and reminders must use configured user or project IANA time zones, weekday calculations and
    quiet hours in R1.
  priority: Must
  release: R1
  status: approved
  parent: PR-007
  source_doc: FRD.md
- id: FR-ESC-001
  type: functional
  title: Reminder schedule
  statement: The system must send reminders according to a configured schedule when no valid response is received.
  priority: Must
  release: R1
  status: approved
  parent: PR-007
  source_doc: FRD.md
- id: FR-ESC-002
  type: functional
  title: Escalation policy
  statement: Administrators must be able to configure escalation stages, delays, recipients and channels.
  priority: Must
  release: R1
  status: approved
  parent: PR-007
  source_doc: FRD.md
- id: FR-ESC-003
  type: functional
  title: PM escalation
  statement: The system must be able to notify the project manager after configured unanswered reminders.
  priority: Must
  release: R1
  status: approved
  parent: PR-007
  source_doc: FRD.md
- id: FR-ESC-004
  type: functional
  title: Lead escalation
  statement: The system must be able to notify a team lead or alternate role after a continued non-response.
  priority: Should
  release: R1
  status: approved
  parent: PR-007
  source_doc: FRD.md
- id: FR-ESC-005
  type: functional
  title: Escalation context
  statement: An escalation must include request history, project impact and the exact missing information.
  priority: Must
  release: R1
  status: approved
  parent: PR-007
  source_doc: FRD.md
- id: FR-ESC-006
  type: functional
  title: Duplicate suppression
  statement: The system must prevent duplicate reminders or escalations for the same active obligation.
  priority: Must
  release: R1
  status: approved
  parent: PR-007
  source_doc: FRD.md
- id: FR-ESC-007
  type: functional
  title: Manual pause
  statement: An authorized user must be able to pause or close an update obligation with a recorded reason.
  priority: Should
  release: R1
  status: approved
  parent: PR-007
  source_doc: FRD.md
- id: FR-ESC-008
  type: functional
  title: Calendar rules
  statement: The policy should support configurable customer holiday calendars beyond the R1 weekday, time-zone
    and quiet-hour controls.
  priority: Should
  release: R2
  status: draft
  parent: PR-007
  source_doc: FRD.md
- id: FR-ADV-001
  type: functional
  title: Rule-based trigger
  statement: Recommendations must be triggered by approved delivery rules and current facts.
  priority: Must
  release: R1
  status: approved
  parent: PR-008
  source_doc: FRD.md
- id: FR-ADV-002
  type: functional
  title: PM advice
  statement: The product must provide project managers with prioritized suggested follow-up or recovery actions.
  priority: Should
  release: R1
  status: approved
  parent: PR-008
  source_doc: FRD.md
- id: FR-ADV-003
  type: functional
  title: Scrum-master advice
  statement: The product must provide scrum masters with relevant blocker, carryover and sprint-hygiene suggestions.
  priority: Should
  release: R1
  status: approved
  parent: PR-008
  source_doc: FRD.md
- id: FR-ADV-004
  type: functional
  title: Team-lead advice
  statement: The product must provide team leads with relevant ownership, dependency and technical-decision suggestions.
  priority: Should
  release: R1
  status: approved
  parent: PR-008
  source_doc: FRD.md
- id: FR-ADV-005
  type: functional
  title: PMO advice
  statement: The product must provide PMO users with reporting, governance and portfolio-intervention suggestions.
  priority: Should
  release: R1
  status: approved
  parent: PR-008
  source_doc: FRD.md
- id: FR-ADV-006
  type: functional
  title: Leadership advice
  statement: Leadership recommendations must focus on decisions and interventions, not operational task management.
  priority: Should
  release: R1
  status: approved
  parent: PR-008
  source_doc: FRD.md
- id: FR-ADV-007
  type: functional
  title: Advice rationale
  statement: Each recommendation must state the triggering facts, rule and expected outcome.
  priority: Must
  release: R1
  status: approved
  parent: PR-008
  source_doc: FRD.md
- id: FR-ADV-008
  type: functional
  title: No blame attribution
  statement: The system must not attribute personal blame unless an authorized source explicitly records responsibility
    and the context is appropriate.
  priority: Must
  release: R1
  status: approved
  parent: BR-013
  source_doc: FRD.md
- id: FR-APP-001
  type: functional
  title: Action risk class
  statement: Every proposed action must have a configured risk and approval class.
  priority: Must
  release: R1
  status: approved
  parent: PR-009
  source_doc: FRD.md
- id: FR-APP-002
  type: functional
  title: Approval diff
  statement: A material proposal must show current value, proposed value, reason, source, evidence and intended
    side effects.
  priority: Must
  release: R1
  status: approved
  parent: PR-009
  source_doc: FRD.md
- id: FR-APP-003
  type: functional
  title: Edit proposal
  statement: An authorized reviewer must be able to edit a proposal before approval.
  priority: Must
  release: R1
  status: approved
  parent: PR-009
  source_doc: FRD.md
- id: FR-APP-004
  type: functional
  title: Approve or reject
  statement: An authorized reviewer must be able to approve or reject a proposal with an optional reason.
  priority: Must
  release: R1
  status: approved
  parent: PR-009
  source_doc: FRD.md
- id: FR-APP-005
  type: functional
  title: Approval authority
  statement: The system must enforce the configured approval role for the action type and project.
  priority: Must
  release: R1
  status: approved
  parent: PR-009
  source_doc: FRD.md
- id: FR-APP-006
  type: functional
  title: Approval expiry
  statement: A proposal must expire or require reconfirmation after its configured validity period.
  priority: Should
  release: R1
  status: approved
  parent: PR-009
  source_doc: FRD.md
- id: FR-APP-007
  type: functional
  title: Current-value recheck
  statement: Immediately before execution, the system must verify that the source value still matches the approved
    comparison base.
  priority: Must
  release: R1
  status: approved
  parent: PR-009
  source_doc: FRD.md
- id: FR-APP-008
  type: functional
  title: Changed-source block
  statement: If the source changed after approval, the system must stop execution and create a new proposal or reconciliation
    task.
  priority: Must
  release: R1
  status: approved
  parent: PR-009
  source_doc: FRD.md
- id: FR-APP-009
  type: functional
  title: Bulk approval guardrail
  statement: Bulk approval must be disabled for material actions in Release 1.
  priority: Must
  release: R1
  status: approved
  parent: PR-009
  source_doc: FRD.md
- id: FR-APP-010
  type: functional
  title: Shadow action
  statement: In shadow mode, proposals must be recorded but never sent or executed externally.
  priority: Must
  release: R1
  status: approved
  parent: PR-014
  source_doc: FRD.md
- id: FR-WRB-001
  type: functional
  title: Jira comment write-back
  statement: The system must support an approved Jira comment write-back for Release 1.
  priority: Must
  release: R1
  status: approved
  parent: PR-009
  source_doc: FRD.md
- id: FR-WRB-002
  type: functional
  title: Selected field write-back
  statement: The system may support approved changes to a configured allowlist of non-baseline Jira fields in R2
    after connector concurrency and stability review.
  priority: Should
  release: R2
  status: draft
  parent: PR-009
  source_doc: FRD.md
- id: FR-WRB-003
  type: functional
  title: No unrestricted writes
  statement: The agent must not receive a generic unrestricted Jira update capability.
  priority: Must
  release: R1
  status: approved
  parent: PR-009
  source_doc: FRD.md
- id: FR-WRB-004
  type: functional
  title: Idempotency key
  statement: Each external write must use an idempotency control or equivalent duplicate protection.
  priority: Must
  release: R1
  status: approved
  parent: PR-009
  source_doc: FRD.md
- id: FR-WRB-005
  type: functional
  title: Permission check
  statement: The system must check application and connector permission before execution.
  priority: Must
  release: R1
  status: approved
  parent: PR-009
  source_doc: FRD.md
- id: FR-WRB-006
  type: functional
  title: Write attribution
  statement: The external update must identify its source and acting integration account where supported.
  priority: Should
  release: R1
  status: approved
  parent: PR-009
  source_doc: FRD.md
- id: FR-WRB-007
  type: functional
  title: Execution result
  statement: The system must record success, failure, external record revision and returned identifier.
  priority: Must
  release: R1
  status: approved
  parent: PR-009
  source_doc: FRD.md
- id: FR-WRB-008
  type: functional
  title: Safe retry
  statement: Only failures classified as safe to retry may be retried automatically.
  priority: Must
  release: R1
  status: approved
  parent: PR-009
  source_doc: FRD.md
- id: FR-WRB-009
  type: functional
  title: No baseline change
  statement: The product must not automatically change project baselines, budget or contractual commitments.
  priority: Must
  release: R1
  status: approved
  parent: BR-007
  source_doc: FRD.md
- id: FR-WRB-010
  type: functional
  title: No autonomous completion
  statement: The product must not autonomously mark a work item complete in Release 1.
  priority: Must
  release: R1
  status: approved
  parent: BR-007
  source_doc: FRD.md
