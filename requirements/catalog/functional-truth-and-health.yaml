schema_version: '1.0'
product: Project Delivery Assurance Agent
baseline: '0.1'
requirements:
- id: FR-CON-001
  type: functional
  title: Jira Cloud connection
  statement: An administrator must be able to connect a Jira Cloud site using an approved authentication method
    and least-privilege scopes.
  priority: Must
  release: R1
  status: approved
  parent: PR-001
  source_doc: FRD.md
- id: FR-CON-002
  type: functional
  title: Jira project discovery
  statement: The connector must list only Jira projects visible to the configured identity.
  priority: Must
  release: R1
  status: approved
  parent: PR-001
  source_doc: FRD.md
- id: FR-CON-003
  type: functional
  title: Jira delivery data
  statement: The connector must read configured projects, boards, sprints, issues, comments, changelog, links and
    selected custom fields.
  priority: Must
  release: R1
  status: approved
  parent: PR-002
  source_doc: FRD.md
- id: FR-CON-004
  type: functional
  title: Webhook ingestion
  statement: The connector must accept supported Jira webhook events with signature or authenticity controls where
    available.
  priority: Should
  release: R1
  status: approved
  parent: PR-005
  source_doc: FRD.md
- id: FR-CON-005
  type: functional
  title: Scheduled reconciliation
  statement: The connector must run scheduled reconciliation to recover missed events and refresh current state.
  priority: Must
  release: R1
  status: approved
  parent: PR-005
  source_doc: FRD.md
- id: FR-CON-006
  type: functional
  title: Spreadsheet import
  statement: An authorized user must be able to import Excel or CSV portfolio data through a configured mapping.
  priority: Must
  release: R1
  status: approved
  parent: PR-002
  source_doc: FRD.md
- id: FR-CON-007
  type: functional
  title: Mapping preview
  statement: The system must preview source-to-canonical field mappings and validation errors before import.
  priority: Must
  release: R1
  status: approved
  parent: PR-002
  source_doc: FRD.md
- id: FR-CON-008
  type: functional
  title: Incremental synchronization
  statement: The system must avoid reprocessing unchanged source records where feasible.
  priority: Should
  release: R1
  status: approved
  parent: PR-005
  source_doc: FRD.md
- id: FR-CON-009
  type: functional
  title: Connector health
  statement: The system must display connection state, last success, last failure and actionable error detail.
  priority: Must
  release: R1
  status: approved
  parent: PR-012
  source_doc: FRD.md
- id: FR-CON-010
  type: functional
  title: Idempotent events
  statement: Repeated delivery of the same source event must not create duplicate facts, reminders or writes.
  priority: Must
  release: R1
  status: approved
  parent: PR-005
  source_doc: FRD.md
- id: FR-CON-011
  type: functional
  title: Connector abstraction
  statement: External systems must implement a common connector contract without leaking SDK-specific types into
    domain modules.
  priority: Must
  release: R1
  status: approved
  parent: PR-013
  source_doc: FRD.md
- id: FR-CON-012
  type: functional
  title: Read-only mode
  statement: Each connector must support a configuration that prevents external writes.
  priority: Must
  release: R1
  status: approved
  parent: PR-014
  source_doc: FRD.md
- id: FR-MOD-001
  type: functional
  title: Portfolio hierarchy
  statement: The canonical model must represent portfolios, programmes and projects.
  priority: Must
  release: R1
  status: approved
  parent: PR-002
  source_doc: FRD.md
- id: FR-MOD-002
  type: functional
  title: Delivery hierarchy
  statement: The canonical model must represent sprints, milestones, work items and relationships.
  priority: Must
  release: R1
  status: approved
  parent: PR-002
  source_doc: FRD.md
- id: FR-MOD-003
  type: functional
  title: RAID and decisions
  statement: The canonical model must represent risks, assumptions, issues, dependencies, decisions and actions.
  priority: Should
  release: R1
  status: approved
  parent: PR-002
  source_doc: FRD.md
- id: FR-MOD-004
  type: functional
  title: Project ownership
  statement: The model must represent sponsor, PM, scrum master, team lead and responsible owner relationships.
  priority: Must
  release: R1
  status: approved
  parent: PR-002
  source_doc: FRD.md
- id: FR-MOD-005
  type: functional
  title: Dates and forecasts
  statement: The model must distinguish baseline, planned, forecast and actual dates.
  priority: Must
  release: R1
  status: approved
  parent: PR-002
  source_doc: FRD.md
- id: FR-MOD-006
  type: functional
  title: Project health
  statement: The model must store reported health separately from calculated delivery signals.
  priority: Must
  release: R1
  status: approved
  parent: PR-002
  source_doc: FRD.md
- id: FR-MOD-007
  type: functional
  title: External identity mapping
  statement: The model must retain mappings between canonical entities and source-system records.
  priority: Must
  release: R1
  status: approved
  parent: PR-002
  source_doc: FRD.md
- id: FR-MOD-008
  type: functional
  title: Configurable terminology
  statement: Administrators must be able to map customer terminology to canonical concepts without changing code.
  priority: Should
  release: R1
  status: approved
  parent: PR-013
  source_doc: FRD.md
- id: FR-EVD-001
  type: functional
  title: Fact record
  statement: Every material project fact must retain its value, type, effective date, observed date and source.
  priority: Must
  release: R1
  status: approved
  parent: PR-003
  source_doc: FRD.md
- id: FR-EVD-002
  type: functional
  title: Evidence link
  statement: A fact must retain a resolvable source record identifier or approved stored evidence reference.
  priority: Must
  release: R1
  status: approved
  parent: PR-003
  source_doc: FRD.md
- id: FR-EVD-003
  type: functional
  title: Fact classification
  statement: A material fact must retain immutable provenance (SYSTEM_VERIFIED, HUMAN_CONFIRMED, AGENT_INFERENCE
    or UNKNOWN), independent freshness (CURRENT, STALE or UNKNOWN) and conflict (NONE or CONFLICTING); derive its
    display classification deterministically under ADR-009.
  priority: Must
  release: R1
  status: approved
  parent: PR-003
  source_doc: FRD.md
- id: FR-EVD-004
  type: functional
  title: Fact versioning
  statement: Changing a fact must create a new version while retaining the previous value and provenance.
  priority: Must
  release: R1
  status: approved
  parent: PR-003
  source_doc: FRD.md
- id: FR-EVD-005
  type: functional
  title: Human confirmation
  statement: The system must record who confirmed a fact and when.
  priority: Must
  release: R1
  status: approved
  parent: PR-003
  source_doc: FRD.md
- id: FR-EVD-006
  type: functional
  title: Freshness policy
  statement: The system must calculate fact freshness using configurable validity periods by fact type.
  priority: Must
  release: R1
  status: approved
  parent: PR-005
  source_doc: FRD.md
- id: FR-EVD-007
  type: functional
  title: Conflict state
  statement: When authoritative sources disagree, the system must retain both values and mark the fact as conflicting.
  priority: Must
  release: R1
  status: approved
  parent: PR-004
  source_doc: FRD.md
- id: FR-EVD-008
  type: functional
  title: Confidence
  statement: The system must retain an explainable confidence level without presenting it as proof.
  priority: Should
  release: R1
  status: approved
  parent: PR-003
  source_doc: FRD.md
- id: FR-EVD-009
  type: functional
  title: Evidence access
  statement: A user must be able to inspect evidence supporting a claim when authorized for the source project.
  priority: Must
  release: R1
  status: approved
  parent: PR-010
  source_doc: FRD.md
- id: FR-EVD-010
  type: functional
  title: Evidence expiry
  statement: Expired or superseded evidence must not be used as current fact without a visible warning.
  priority: Must
  release: R1
  status: approved
  parent: PR-003
  source_doc: FRD.md
- id: FR-EVD-011
  type: functional
  title: Source snapshot metadata
  statement: The system must retain source synchronization time and source revision where available.
  priority: Should
  release: R1
  status: approved
  parent: PR-003
  source_doc: FRD.md
- id: FR-EVD-012
  type: functional
  title: No silent conflict resolution
  statement: The system must not silently choose a value when applicable authority rules do not resolve a conflict.
  priority: Must
  release: R1
  status: approved
  parent: PR-004
  source_doc: FRD.md
- id: FR-HLT-001
  type: functional
  title: Update freshness signal
  statement: The system must identify projects whose required update is outside the configured freshness window.
  priority: Must
  release: R1
  status: approved
  parent: PR-005
  source_doc: FRD.md
- id: FR-HLT-002
  type: functional
  title: Completeness signal
  statement: The system must identify required project fields that are missing or unconfirmed.
  priority: Must
  release: R1
  status: approved
  parent: PR-005
  source_doc: FRD.md
- id: FR-HLT-003
  type: functional
  title: Overdue work signal
  statement: The system must identify configured overdue work items and milestones.
  priority: Must
  release: R1
  status: approved
  parent: PR-005
  source_doc: FRD.md
- id: FR-HLT-004
  type: functional
  title: Blocker age signal
  statement: The system must calculate the age of open blockers and compare it with configured thresholds.
  priority: Must
  release: R1
  status: approved
  parent: PR-005
  source_doc: FRD.md
- id: FR-HLT-005
  type: functional
  title: Forecast movement signal
  statement: The system must identify repeated forecast-date changes while retaining the change history.
  priority: Should
  release: R1
  status: approved
  parent: PR-005
  source_doc: FRD.md
- id: FR-HLT-006
  type: functional
  title: Dependency risk signal
  statement: The system must identify a discoverable dependency whose due date or status threatens the dependent
    item.
  priority: Should
  release: R1
  status: approved
  parent: PR-005
  source_doc: FRD.md
- id: FR-HLT-007
  type: functional
  title: Reported-versus-calculated separation
  statement: The system must show reported RAG separately from calculated signals.
  priority: Must
  release: R1
  status: approved
  parent: PR-004
  source_doc: FRD.md
- id: FR-HLT-008
  type: functional
  title: Contradiction detection
  statement: The system must detect configured contradictions between reported status and objective facts.
  priority: Must
  release: R1
  status: approved
  parent: PR-004
  source_doc: FRD.md
- id: FR-HLT-009
  type: functional
  title: Explainable calculation
  statement: Each health signal must expose the inputs and rule that produced it.
  priority: Must
  release: R1
  status: approved
  parent: PR-005
  source_doc: FRD.md
- id: FR-HLT-010
  type: functional
  title: Configurable thresholds
  statement: Authorized administrators must be able to tune thresholds without changing code.
  priority: Should
  release: R1
  status: approved
  parent: PR-013
  source_doc: FRD.md
- id: FR-HLT-011
  type: functional
  title: No LLM health calculation
  statement: The language model must not be the sole calculator of project health or schedule variance.
  priority: Must
  release: R1
  status: approved
  parent: PR-005
  source_doc: FRD.md
- id: FR-HLT-012
  type: functional
  title: Signal history
  statement: The system must retain material signal changes over reporting periods.
  priority: Should
  release: R1
  status: approved
  parent: PR-005
  source_doc: FRD.md
