name: Foundation validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: docker compose up -d --wait
      - run: pnpm build
      - run: pnpm check:architecture && pnpm check:contracts
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: node scripts/check-dependencies.mjs
      - run: pnpm audit --audit-level high
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm test:integration
      - run: pnpm test:recovery
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser workflows
        run: |
          mkdir -p artifacts
          node scripts/local.mjs scripts/dev.mjs > artifacts/dev.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:5173 >/dev/null && break; sleep 1; done
          pnpm test:e2e
      - name: Publish successful database contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: database-contract-evidence
          path: artifacts/database-validation.json
          if-no-files-found: error
      - if: always()
        run: docker compose down
  production-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Isolated production TLS, OIDC and packaged runtime acceptance
        run: node scripts/test-production.mjs
      - name: Publish successful acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-boundary-evidence
          path: artifacts/production-acceptance.json
          if-no-files-found: error
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - name: Collect immutable image SBOM, notices and vulnerability evidence
        run: node scripts/collect-distribution.mjs
      - name: Verify complete evidence file manifest
        run: node scripts/check-distribution.mjs --evidence-only
      - name: Publish distribution evidence and unresolved review gates
        uses: actions/upload-artifact@v4
        with:
          name: distribution-review-evidence
          path: |
            artifacts/distribution-evidence.json
            artifacts/pdaa-distribution-*/
          if-no-files-found: error
