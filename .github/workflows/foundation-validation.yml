name: Foundation validation
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  change-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: '24'
      - name: Classify the exact tested change
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scope=full
          classifier="${BASE_SHA}:.github/scripts/foundation-change-scope.mjs"
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             git cat-file -e "$classifier" 2>/dev/null; then
            scope=$(git show --no-textconv "$classifier" | node --input-type=module - "$GITHUB_EVENT_NAME" "$BASE_SHA" "$HEAD_SHA")
          fi
          printf 'value=%s\n' "$scope" >> "$GITHUB_OUTPUT"
          printf 'Foundation validation scope is %s\n' "$scope"
  xlsx-isolation:
    needs: change-scope
    if: needs.change-scope.outputs.scope != 'evidence-only'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - name: Run disposable Linux XLSX isolation fixture
        run: node scripts/xlsx-isolation/run.mjs
      - name: Validate the decoder-only XLSX runtime image
        run: node scripts/xlsx-runtime/run.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: xlsx-packaged-isolation-evidence
          path: |
            artifacts/xlsx-packaged-isolation.json
            artifacts/xlsx-runtime-package.json
          if-no-files-found: error
  xlsx-customer-bridge:
    needs: change-scope
    if: needs.change-scope.outputs.scope != 'evidence-only'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - name: Verify the packaged Excel bridge, browser import and recovery under both database profiles
        run: node scripts/xlsx-runtime/run-customer.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: xlsx-customer-bridge-evidence
          path: artifacts/xlsx-customer-bridge.json
          if-no-files-found: error
  code-checks:
    needs: change-scope
    if: needs.change-scope.outputs.scope != 'evidence-only'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm setup:local
      - run: pnpm build
      - run: pnpm check:architecture && pnpm check:contracts
      - run: pnpm typecheck && pnpm test
      - run: node scripts/check-dependencies.mjs
      - name: Mandatory dependency audit
        if: always()
        run: pnpm audit --audit-level high
  database-and-browser:
    needs: change-scope
    if: needs.change-scope.outputs.scope != 'evidence-only'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: docker compose up -d --wait
      - run: pnpm build
      - name: Fresh role-absent and partial-role migration bootstrap
        run: node scripts/local.mjs scripts/test-ingestion-role-bootstrap.mjs
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm test:integration
      - run: pnpm test:recovery
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser workflows
        env:
          PDAA_EXEC027_DISPOSABLE_E2E: "1"
        run: |
          mkdir -p artifacts
          node scripts/local.mjs scripts/dev.mjs > artifacts/dev.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:5173 >/dev/null && break; sleep 1; done
          pnpm test:e2e
      - name: Publish reviewed CSV import browser proof
        uses: actions/upload-artifact@v4
        with:
          name: csv-reviewed-import-browser
          path: test-results/**/csv-reviewed-import.png
          if-no-files-found: error
      - name: Real saved PM escalation history browser proof
        run: node scripts/local.mjs scripts/test-escalation-browser.mjs --hosted-foundation
      - name: Publish PM escalation history browser proof
        uses: actions/upload-artifact@v4
        with:
          name: pm-escalation-history-browser
          path: |
            artifacts/pm-escalation-history.png
            artifacts/pm-escalation-history.json
            artifacts/atlas-management-snapshot.png
          if-no-files-found: error
      - name: Publish schedule overdue policy browser proof
        uses: actions/upload-artifact@v4
        with:
          name: schedule-overdue-policy-browser
          path: artifacts/schedule-overdue-policy.png
          if-no-files-found: error
      - name: Publish GOLDEN-002 delivery concern browser proof
        uses: actions/upload-artifact@v4
        with:
          name: golden-002-delivery-concern
          path: test-results/**/golden-002-delivery-concern.png
          if-no-files-found: error
      - name: Publish successful database contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: database-contract-evidence
          path: |
            artifacts/database-validation.json
            artifacts/ingestion-role-bootstrap.json
          if-no-files-found: error
      - name: Publish reviewed evidence workflow screenshots
        uses: actions/upload-artifact@v4
        with:
          name: evidence-workflow-browser
          path: artifacts/evidence-workflow-*.png
          if-no-files-found: error
      - name: Publish milestone reconciliation browser proof
        uses: actions/upload-artifact@v4
        with:
          name: milestone-reconciliation-browser
          path: artifacts/reconciliation-native-pm-proof.png
          if-no-files-found: error
      - if: always()
        run: docker compose down
  verify:
    needs: [change-scope, code-checks, database-and-browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require code, database and browser checks
        shell: bash
        env:
          CHANGE_SCOPE: ${{ needs.change-scope.outputs.scope }}
          CHANGE_SCOPE_RESULT: ${{ needs.change-scope.result }}
          CODE_RESULT: ${{ needs.code-checks.result }}
          DATABASE_AND_BROWSER_RESULT: ${{ needs.database-and-browser.result }}
        run: |
          test "$CHANGE_SCOPE_RESULT" = success
          if [[ "$CHANGE_SCOPE" == evidence-only ]]; then
            test "$GITHUB_EVENT_NAME" = pull_request
            test "$CODE_RESULT" = skipped
            test "$DATABASE_AND_BROWSER_RESULT" = skipped
          else
            test "$CHANGE_SCOPE" = full
            test "$CODE_RESULT" = success
            test "$DATABASE_AND_BROWSER_RESULT" = success
          fi
  production-boundary:
    needs: change-scope
    if: needs.change-scope.outputs.scope != 'evidence-only'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Isolated production TLS, OIDC and packaged runtime acceptance
        run: node scripts/test-production.mjs
      - name: Publish successful acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-boundary-evidence
          path: |
            artifacts/production-acceptance.json
            artifacts/pdaa-acceptance-*/checks.json
            artifacts/pdaa-acceptance-*/scalar-temporal-vectors-original.json
            artifacts/pdaa-acceptance-*/customer-*/scalar-temporal-vectors-original.json
            artifacts/pdaa-acceptance-*/customer-*/evidence-stale-conflict.png
            artifacts/pdaa-acceptance-*/customer-*/golden-002-delivery-concern.png
            artifacts/pdaa-acceptance-*/customer-*/golden-002-delivery-concern.json
            artifacts/pdaa-acceptance-*/customer-*/milestone-reconciliation-workflow-fixture.json
            artifacts/pdaa-acceptance-*/customer-*/project-fact-persistence.json
            artifacts/pdaa-acceptance-*/customer-*/milestone-reconciliation-pm-*.png
            artifacts/pdaa-acceptance-*/customer-*/scalar-reconciliation-workflow-fixture.json
            artifacts/pdaa-acceptance-*/customer-*/scalar-reconciliation-pm-*.png
            artifacts/pdaa-acceptance-*/customer-*/csv-import-workflow-fixture.json
            artifacts/pdaa-acceptance-*/customer-*/csv-native-reviewed-import.png
            artifacts/pdaa-acceptance-*/customer-*/csv-comparison-workflow-fixture.json
            artifacts/pdaa-acceptance-*/customer-*/csv-comparison-rename.png
            artifacts/pdaa-acceptance-*/customer-*/csv-comparison-move.png
            artifacts/pdaa-acceptance-*/customer-*/csv-comparison-changed.png
            artifacts/pdaa-acceptance-*/customer-*/csv-comparison-saved.png
          if-no-files-found: error
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - name: Prepare pinned Node source correspondence evidence
        run: node scripts/prepare-node-resource-sources.mjs
      - name: Collect immutable image SBOM, notices and vulnerability evidence
        run: node scripts/collect-distribution.mjs
      - name: Verify complete evidence file manifest
        run: node scripts/check-distribution.mjs --evidence-only
      - name: Publish distribution evidence and unresolved review gates
        uses: actions/upload-artifact@v4
        with:
          name: distribution-review-evidence
          path: |
            artifacts/distribution-evidence.json
            artifacts/pdaa-distribution-*/
          if-no-files-found: error
